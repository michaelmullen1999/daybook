name: Build app and family page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    name: Android app (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Signing key (keeps updates installing over the old app)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore;
          else echo "::warning::No DEBUG_KEYSTORE_BASE64 secret: updates won't install over the old app"; fi
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Daybook.apk
      - uses: actions/upload-artifact@v4
        with: { name: Daybook-APK, path: Daybook.apk, retention-days: 30 }
      - name: Publish install link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Daybook app (latest)
          body: "Install on Brian's Android tablet or phone: open https://github.com/michaelmullen1999/daybook/releases/latest/download/Daybook.apk on the device."
          files: Daybook.apk
          make_latest: true

  site:
    name: Family page (website)
    needs: apk   # publish the new APK first, so the "update ready" button never points at an old one
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
